name: Rota CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chatgpt/rota-refinement-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
